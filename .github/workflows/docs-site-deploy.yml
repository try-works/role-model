name: Docs site deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-site-deploy.yml"
      - "apps/docs-site/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - ".github/workflows/docs-site-deploy.yml"
      - "apps/docs-site/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Print toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm docs:build

      - name: Upload docs build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-build
          path: apps/docs-site/build/client
          retention-days: 7

  deploy:
    name: Deploy docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docs build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site-build
          path: apps/docs-site/build/client

      - name: Check Cloudflare deploy posture
        id: cloudflare_ready
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Skipping docs deploy because Cloudflare secrets are not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.cloudflare_ready.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        if: steps.cloudflare_ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Print toolchain versions
        if: steps.cloudflare_ready.outputs.ready == 'true'
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        if: steps.cloudflare_ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy docs site
        if: steps.cloudflare_ready.outputs.ready == 'true'
        run: |
          pnpm exec wrangler pages deploy apps/docs-site/build/client \
            --project-name role-model-dev \
            --branch main \
            --commit-hash "${GITHUB_SHA}"

      - name: Verify docs deployment
        if: steps.cloudflare_ready.outputs.ready == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://role-model.dev/ > /dev/null
