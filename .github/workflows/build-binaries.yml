name: build-binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-runtime:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-13
            target: darwin-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: windows-latest
            target: win32-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build UI
        run: corepack pnpm --filter @role-model-router/runtime-ui run build

      - name: Package SEA runtime
        run: corepack pnpm run runtime:package-sea

      - name: Verify Windows standalone package
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $packageDir = "role-model-router/dist/release/win32-x64"
          @(
            "$packageDir/role-model-runtime.exe",
            "$packageDir/role-model-launcher.exe",
            "$packageDir/Role-Model.bat",
            "$packageDir/build/client/index.html",
            "$packageDir/testdata/router-runtime/fixtures/provider-accounts.json",
            "$packageDir/testdata/catalog/litellm-model-prices.json",
            "$packageDir/role-model-router/packages/catalog/data/normalized-catalog.json"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) {
              throw "Missing packaged artifact: $_"
            }
          }

      - name: Archive standalone package (Unix)
        if: matrix.target != 'win32-x64'
        run: |
          mkdir -p role-model-router/dist/archive
          tar -czf "role-model-router/dist/archive/role-model-router-${{ matrix.target }}.tar.gz" \
            -C "role-model-router/dist/release/${{ matrix.target }}" .

      - name: Archive standalone package (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $archiveDir = "role-model-router/dist/archive"
          $packageDir = "role-model-router/dist/release/win32-x64"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          Compress-Archive -Path "$packageDir\*" -DestinationPath "$archiveDir\role-model-router-win32-x64.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: role-model-runtime-${{ matrix.target }}
          path: role-model-router/dist/archive/role-model-router-${{ matrix.target }}.*

      - name: Publish release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: role-model-router/dist/archive/role-model-router-${{ matrix.target }}.*

      - name: Publish installer scripts
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'linux-x64'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scripts/install.sh
            scripts/install.ps1
