name: build-binaries

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Runtime channel to package
        required: true
        default: development
        type: choice
        options:
          - development
          - stage
          - production
      private_sha:
        description: Exact private role-model-internal commit embedded in a stage candidate
        required: false
        type: string
      release_id:
        description: Exact sha256-prefixed Run 88 candidate identity to bind into a stage package
        required: false
        type: string
  push:
    branches:
      - stage
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ROLE_MODEL_BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'production' || (github.ref_name == 'stage' && 'stage' || inputs.channel || 'development') }}
  PRIVATE_PAIRED_SHA: ${{ inputs.private_sha || vars.ROLE_MODEL_PAIRED_PRIVATE_SHA }}
  RUN88_RELEASE_ID: ${{ inputs.release_id || vars.RUN88_RELEASE_ID }}

concurrency:
  group: runtime-build-${{ github.ref }}-${{ inputs.channel || 'automatic' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-runtime:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: windows-latest
            target: win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Validate stable production tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release tag must be exact SemVer (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Production tag must point to a commit promoted through main."
            exit 1
          fi

      - name: Resolve public source tree
        id: public_source
        shell: bash
        run: |
          source_tree="$(git rev-parse HEAD^{tree})"
          if [[ ! "$source_tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Public source tree must be an exact 40-character Git tree."
            exit 1
          fi
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Validate Run 88 stage identity inputs
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage'
        shell: bash
        env:
          PUBLIC_PAIRED_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$PUBLIC_PAIRED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Stage public revision must be an exact 40-character commit."
            exit 1
          fi
          if [[ ! "$PRIVATE_PAIRED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Stage private revision must be an exact 40-character commit."
            exit 1
          fi
          if [[ ! "$RUN88_RELEASE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "RUN88_RELEASE_ID must be an exact sha256-prefixed candidate identity."
            exit 1
          fi

      - name: Resolve tested stage candidate
        id: stage_candidate
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $artifactName = "role-model-stage-candidate-${{ steps.public_source.outputs.source_tree }}-${{ matrix.target }}"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $listUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$artifactName&per_page=20"
          $artifact = $null
          $candidates = (Invoke-RestMethod -Headers $headers -Uri $listUrl).artifacts |
            Where-Object { -not $_.expired } |
            Sort-Object created_at -Descending
          foreach ($candidate in $candidates) {
            if ($candidate.workflow_run.head_branch -ne "stage") { continue }
            $runUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($candidate.workflow_run.id)"
            $run = Invoke-RestMethod -Headers $headers -Uri $runUrl
            if (
              $run.status -eq "completed" -and
              $run.conclusion -eq "success" -and
              $run.event -eq "push" -and
              $run.head_branch -eq "stage" -and
              $run.head_sha -eq $candidate.workflow_run.head_sha -and
              $run.path -eq ".github/workflows/build-binaries.yml"
            ) {
              $artifact = $candidate
              break
            }
          }
          if (-not $artifact) { throw "No tested stage candidate found for $artifactName" }
          $stageSha = $artifact.workflow_run.head_sha
          $candidateTag = "stage-rc-$($stageSha.Substring(0, 12))"
          $approvalRefUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/rc-approved/$stageSha"
          try {
            $approval = Invoke-RestMethod -Headers $headers -Uri $approvalRefUrl
          } catch {
            throw "Tested stage candidate $stageSha has no explicit rc-approved acceptance receipt"
          }
          if ($approval.object.type -ne "commit" -or $approval.object.sha -ne $stageSha) {
            throw "Release candidate acceptance receipt does not point to the tested stage commit"
          }
          $candidateReleaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$candidateTag"
          try {
            $candidateRelease = Invoke-RestMethod -Headers $headers -Uri $candidateReleaseUrl
          } catch {
            throw "Accepted stage candidate has no published prerelease: $candidateTag"
          }
          if ($candidateRelease.draft -or -not $candidateRelease.prerelease -or $candidateRelease.tag_name -ne $candidateTag) {
            throw "Accepted stage candidate release is not a published prerelease"
          }
          $candidateRefUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$candidateTag"
          try {
            $candidateRef = Invoke-RestMethod -Headers $headers -Uri $candidateRefUrl
          } catch {
            throw "Published stage prerelease tag cannot be resolved: $candidateTag"
          }
          if ($candidateRef.object.type -ne "commit" -or $candidateRef.object.sha -ne $stageSha) {
            throw "Published stage prerelease tag does not point to the tested stage commit"
          }
          $outerZip = Join-Path $env:RUNNER_TEMP "stage-candidate.zip"
          $outerDir = Join-Path $env:RUNNER_TEMP "stage-candidate"
          $innerDir = Join-Path $env:RUNNER_TEMP "stage-package"
          Invoke-WebRequest -Headers $headers -Uri $artifact.archive_download_url -OutFile $outerZip
          Expand-Archive -LiteralPath $outerZip -DestinationPath $outerDir -Force
          $archive = Get-ChildItem -LiteralPath $outerDir -File | Select-Object -First 1
          if (-not $archive) { throw "Stage candidate artifact contains no archive" }
          New-Item -ItemType Directory -Force -Path $innerDir | Out-Null
          if ($archive.Extension -eq ".zip") {
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $innerDir -Force
          } else {
            tar -xzf $archive.FullName -C $innerDir
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract stage candidate" }
          }
          $stageManifestPath = Get-ChildItem -LiteralPath $innerDir -Recurse -Filter manifest.json |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $stageManifestPath) { throw "Stage candidate contains no manifest" }
          $stage = Get-Content -LiteralPath $stageManifestPath -Raw | ConvertFrom-Json
          if ($stage.channel -ne "stage" -or $stage.name -ne "role-model-stage") { throw "Artifact is not a stage candidate" }
          if ($stage.commit -ne $stageSha) { throw "Stage candidate public commit mismatch" }
          if ($stage.source_tree -ne "${{ steps.public_source.outputs.source_tree }}") { throw "Stage candidate public source tree mismatch" }
          if ($stage.release_id -notmatch '^sha256:[0-9a-f]{64}$') { throw "Stage candidate release identity is invalid" }
          if ($stage.private_source_commit -notmatch '^[0-9a-f]{40}$') { throw "Stage candidate private source identity is invalid" }
          if ($stage.private_distribution_sha256 -ne $stage.track_b_runtime.manifest_sha256) { throw "Stage candidate private distribution binding mismatch" }
          if ($stage.track_b_runtime.sidecar_sha256 -notmatch '^[0-9a-f]{64}$') { throw "Stage candidate sidecar identity is invalid" }
          if ($stage.track_b_runtime.extension_count -ne 13) { throw "Stage candidate does not contain all thirteen extensions" }
          "stage_manifest_path=$stageManifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_id=$($stage.release_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "private_source_commit=$($stage.private_source_commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "stage_sha=$stageSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout exact accepted stage public revision
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.stage_candidate.outputs.stage_sha }}
          # The stable package is built from main, but Track B must preserve
          # the exact accepted stage candidate's public-commit provenance.
          path: .cache/paired-public
          fetch-depth: 1

      - name: Verify accepted stage public source identity
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        shell: bash
        env:
          ACCEPTED_STAGE_SHA: ${{ steps.stage_candidate.outputs.stage_sha }}
          EXPECTED_SOURCE_TREE: ${{ steps.public_source.outputs.source_tree }}
        run: |
          if [[ "$(git -C .cache/paired-public rev-parse HEAD)" != "$ACCEPTED_STAGE_SHA" ]]; then
            echo "Accepted stage public checkout does not match the stage candidate."
            exit 1
          fi
          if [[ "$(git -C .cache/paired-public rev-parse HEAD^{tree})" != "$EXPECTED_SOURCE_TREE" ]]; then
            echo "Accepted stage public checkout does not match the production source tree."
            exit 1
          fi

      - name: Select exact paired release identity
        id: release_identity
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage' || env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        shell: pwsh
        run: |
          if ($env:ROLE_MODEL_BUILD_CHANNEL -eq "production") {
            $privateSource = "${{ steps.stage_candidate.outputs.private_source_commit }}"
            $releaseId = "${{ steps.stage_candidate.outputs.release_id }}"
          } else {
            $privateSource = $env:PRIVATE_PAIRED_SHA
            $releaseId = $env:RUN88_RELEASE_ID
          }
          if ($privateSource -notmatch '^[0-9a-f]{40}$') { throw "Exact private paired commit is invalid" }
          if ($releaseId -notmatch '^sha256:[0-9a-f]{64}$') { throw "Exact Run 88 release identity is invalid" }
          "private_source_commit=$privateSource" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_id=$releaseId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      - name: Print toolchain versions
        run: |
          node --version
          pnpm --version
          go version
          git --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production Track B is deliberately built against the immutable public
      # Stage checkout, not the main checkout.  Install its workspace links
      # separately so esbuild can resolve the public runtime packages without
      # changing the Stage-source provenance binding.
      - name: Install exact accepted stage public dependencies
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        working-directory: .cache/paired-public
        run: corepack pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm --filter @role-model-router/runtime-ui run build

      - name: Validate exact private release revision
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage' || env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        shell: bash
        env:
          RELEASE_PRIVATE_SHA: ${{ steps.release_identity.outputs.private_source_commit }}
        run: |
          if [[ ! "$RELEASE_PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Paired private revision must be an exact 40-character commit."
            exit 1
          fi

      - name: Checkout exact private release revision
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage' || env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        uses: actions/checkout@v4
        with:
          repository: try-works/role-model-internal
          ref: ${{ steps.release_identity.outputs.private_source_commit }}
          token: ${{ secrets.ROLE_MODEL_INTERNAL_READ_TOKEN }}
          # Keep the paired source outside the public Git worktree.  SEA
          # packaging deliberately rejects any untracked public source file.
          path: .cache/paired-private
          fetch-depth: 0

      - name: Verify private revision passed paired promotion branch
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage' || env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        working-directory: .cache/paired-private
        shell: bash
        env:
          RELEASE_PRIVATE_SHA: ${{ steps.release_identity.outputs.private_source_commit }}
          REQUIRED_PRIVATE_BRANCH: ${{ env.ROLE_MODEL_BUILD_CHANNEL == 'production' && 'main' || 'stage' }}
        run: |
          actual_private_sha="$(git rev-parse HEAD)"
          if [[ "$actual_private_sha" != "$RELEASE_PRIVATE_SHA" ]]; then
            echo "Private checkout does not match the paired release identity."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${REQUIRED_PRIVATE_BRANCH}:refs/remotes/origin/${REQUIRED_PRIVATE_BRANCH}"
          if ! git merge-base --is-ancestor "$RELEASE_PRIVATE_SHA" "origin/$REQUIRED_PRIVATE_BRANCH"; then
            echo "Private revision must be promoted through role-model-internal/$REQUIRED_PRIVATE_BRANCH before $ROLE_MODEL_BUILD_CHANNEL packaging."
            exit 1
          fi

      - name: Build exact private release distribution
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage' || env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        working-directory: .cache/paired-private
        env:
          ROLE_MODEL_PUBLIC_WORKTREE: ${{ env.ROLE_MODEL_BUILD_CHANNEL == 'production' && format('{0}/.cache/paired-public', github.workspace) || github.workspace }}
          NODE_OPTIONS: --conditions=runtime
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build:run00-runtime

      - name: Package SEA runtime
        env:
          ROLE_MODEL_TRACK_B_DISTRIBUTION_ROOT: ${{ (env.ROLE_MODEL_BUILD_CHANNEL == 'stage' || env.ROLE_MODEL_BUILD_CHANNEL == 'production') && format('{0}/.cache/paired-private/dist/run00-dev', github.workspace) || '' }}
          RUN88_RELEASE_ID: ${{ steps.release_identity.outputs.release_id || env.RUN88_RELEASE_ID }}
        run: pnpm run runtime:package-sea

      - name: Bind canonical Run 88 identity into release package
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage' || env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        shell: pwsh
        run: node scripts/run88-stage-release.mjs --manifest "${{ github.workspace }}/role-model-router/dist/release/${{ matrix.target }}/manifest.json" --release-id "${{ steps.release_identity.outputs.release_id }}" --private-source "${{ steps.release_identity.outputs.private_source_commit }}"

      - name: Verify channel manifest identity
        id: runtime_identity
        shell: pwsh
        run: |
          $manifestPath = "role-model-router/dist/release/${{ matrix.target }}/manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          foreach ($field in @("channel", "name", "endpoint", "source_tree", "executable_sha256", "core_payload_sha256")) {
            if (-not $manifest.$field) { throw "Missing manifest field: $field" }
          }
          if ($manifest.channel -ne $env:ROLE_MODEL_BUILD_CHANNEL) {
            throw "Manifest channel '$($manifest.channel)' does not match '$env:ROLE_MODEL_BUILD_CHANNEL'"
          }
          if (
            $env:ROLE_MODEL_BUILD_CHANNEL -in @("stage", "production") -and
            $manifest.commit -ne $env:GITHUB_SHA
          ) {
            throw "Manifest commit '$($manifest.commit)' does not match '$env:GITHUB_SHA'"
          }
          $expectedName = switch ($env:ROLE_MODEL_BUILD_CHANNEL) {
            "production" { "role-model" }
            "stage" { "role-model-stage" }
            "development" { "role-model-dev" }
          }
          if ($manifest.name -ne $expectedName) {
            throw "Manifest name '$($manifest.name)' does not match '$expectedName'"
          }
          if ($env:ROLE_MODEL_BUILD_CHANNEL -in @("stage", "production")) {
            if (-not $manifest.track_b_runtime.manifest_sha256) { throw "Missing release private_distribution_sha256" }
            if ($manifest.track_b_runtime.compatibility_generation -notin @("N", "N-1")) { throw "Invalid release private distribution generation" }
            if ($manifest.track_b_runtime.sidecar_sha256 -notmatch '^[0-9a-f]{64}$') { throw "Invalid release private sidecar identity" }
            if ($manifest.track_b_runtime.extension_count -ne 13) { throw "Release package does not contain all thirteen extensions" }
            "private_distribution_sha256=$($manifest.track_b_runtime.manifest_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            if ($manifest.release_id -ne "${{ steps.release_identity.outputs.release_id }}") { throw "Release manifest release_id mismatch" }
            if ($manifest.private_source_commit -ne "${{ steps.release_identity.outputs.private_source_commit }}") { throw "Release manifest private source mismatch" }
            if ($manifest.private_distribution_sha256 -ne $manifest.track_b_runtime.manifest_sha256) { throw "Release manifest private distribution binding mismatch" }
          }
          $manifestSha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "manifest_sha256=$manifestSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "source_tree=$($manifest.source_tree)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "core_payload_sha256=$($manifest.core_payload_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify complete production pair matches the tested stage candidate
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'production'
        shell: pwsh
        run: node scripts/run88-stage-release.mjs --stage-manifest "${{ steps.stage_candidate.outputs.stage_manifest_path }}" --verify-production-manifest "${{ github.workspace }}/role-model-router/dist/release/${{ matrix.target }}/manifest.json"

      - name: Verify Windows standalone package
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $packageDir = "role-model-router/dist/release/win32-x64"
          $manifest = Get-Content -LiteralPath "$packageDir/manifest.json" -Raw | ConvertFrom-Json
          @(
            "$packageDir/manifest.json",
            "$packageDir/$($manifest.executable)",
            "$packageDir/$($manifest.name)-launcher.exe",
            "$packageDir/$($manifest.name).bat",
            "$packageDir/build/client/index.html",
            "$packageDir/role-model-router/packages/vendor-litellm/data/model-prices.json",
            "$packageDir/role-model-router/packages/catalog/data/normalized-catalog.json"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) {
              throw "Missing packaged artifact: $_"
            }
          }

      - name: Verify package contains no QA fixtures or mock data
        shell: pwsh
        run: |
          $packageDir = "role-model-router/dist/release/${{ matrix.target }}"
          $forbiddenPaths = @(
            "$packageDir/testdata",
            "$packageDir/testdata/router-runtime",
            "$packageDir/.recursive"
          )
          foreach ($path in $forbiddenPaths) {
            if (Test-Path $path) {
              throw "Forbidden QA artifact in packaged runtime: $path"
            }
          }

          $markers = @(
            "phase5.mock",
            "mock.openai",
            "openai.litellm",
            "http://127.0.0.1:45679",
            "anthropic.team.shared",
            "cli.local.coder"
          )
          $textFiles = Get-ChildItem -Path $packageDir -Recurse -File -Include *.css,*.html,*.js,*.json,*.md,*.txt,*.yaml,*.yml
          foreach ($marker in $markers) {
            $hit = $textFiles | Select-String -SimpleMatch $marker | Select-Object -First 1
            if ($hit) {
              throw "Forbidden QA/mock marker '$marker' found in packaged runtime: $($hit.Path)"
            }
          }

      - name: Include managed stage secrets in the stage package
        if: env.ROLE_MODEL_BUILD_CHANNEL == 'stage'
        shell: pwsh
        env:
          STAGE_ARTIFACT_DIGEST_KEY: ${{ secrets.STAGE_ARTIFACT_DIGEST_KEY }}
          STAGE_ARTIFACT_ENCRYPTION_KEY: ${{ secrets.STAGE_ARTIFACT_ENCRYPTION_KEY }}
          STAGE_DESTINATION_MATERIAL: ${{ secrets.STAGE_DESTINATION_MATERIAL }}
          STAGE_RECOMMENDATION_MATERIAL: ${{ secrets.STAGE_RECOMMENDATION_MATERIAL }}
        run: |
          $secretsDir = "role-model-router/dist/release/${{ matrix.target }}/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          [IO.File]::WriteAllText("$secretsDir/artifact-digest.key", $env:STAGE_ARTIFACT_DIGEST_KEY)
          [IO.File]::WriteAllText("$secretsDir/artifact-encryption.key", $env:STAGE_ARTIFACT_ENCRYPTION_KEY)
          [IO.File]::WriteAllText("$secretsDir/destination-material.json", $env:STAGE_DESTINATION_MATERIAL)
          [IO.File]::WriteAllText("$secretsDir/recommendation-material.json", $env:STAGE_RECOMMENDATION_MATERIAL)

      - name: Archive standalone package (Unix)
        if: matrix.target != 'win32-x64'
        run: |
          mkdir -p role-model-router/dist/archive
          manifest="role-model-router/dist/release/${{ matrix.target }}/manifest.json"
          runtime_name="$(node -p "require('./${manifest}').name")"
          short_sha="${GITHUB_SHA:0:12}"
          if [[ "$ROLE_MODEL_BUILD_CHANNEL" == "production" ]]; then
            archive_name="role-model-${{ matrix.target }}.tar.gz"
          else
            archive_name="${runtime_name}-${short_sha}-${{ matrix.target }}.tar.gz"
          fi
          tar -czf "role-model-router/dist/archive/${archive_name}" \
            -C "role-model-router/dist/release/${{ matrix.target }}" .
          echo "ARCHIVE_PATH=role-model-router/dist/archive/${archive_name}" >> "$GITHUB_ENV"

      - name: Archive standalone package (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $archiveDir = "role-model-router/dist/archive"
          $packageDir = "role-model-router/dist/release/win32-x64"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          $manifest = Get-Content -LiteralPath "$packageDir/manifest.json" -Raw | ConvertFrom-Json
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          if ($env:ROLE_MODEL_BUILD_CHANNEL -eq "production") {
            $archiveName = "role-model-win32-x64.zip"
          } else {
            $archiveName = "$($manifest.name)-$shortSha-win32-x64.zip"
          }
          $archivePath = "$archiveDir/$archiveName"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $archivePath -Force
          "ARCHIVE_PATH=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attest release archive (attempt 1)
        id: attest_release_archive_attempt_1
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ARCHIVE_PATH }}

      - name: Back off before attestation retry 2
        if: steps.attest_release_archive_attempt_1.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 15

      - name: Attest release archive (attempt 2)
        id: attest_release_archive_attempt_2
        if: steps.attest_release_archive_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ARCHIVE_PATH }}

      - name: Back off before attestation retry 3
        if: steps.attest_release_archive_attempt_2.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Attest release archive (attempt 3)
        id: attest_release_archive_attempt_3
        if: steps.attest_release_archive_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ARCHIVE_PATH }}

      - name: Assert attestation succeeded after retries
        if: steps.attest_release_archive_attempt_1.outcome == 'failure' && steps.attest_release_archive_attempt_2.outcome == 'failure' && steps.attest_release_archive_attempt_3.outcome == 'failure'
        shell: pwsh
        run: |
          throw "Artifact attestation failed after three attempts. Inspect the earlier attest steps for the root cause."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROLE_MODEL_BUILD_CHANNEL == 'stage' && format('role-model-stage-candidate-{0}-{1}', steps.runtime_identity.outputs.source_tree, matrix.target) || format('role-model-runtime-{0}-{1}', env.ROLE_MODEL_BUILD_CHANNEL, matrix.target) }}
          path: ${{ env.ARCHIVE_PATH }}

      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-diagnostics-${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            role-model-router/dist/**
            role-model-router/vendor/llama-swap/dist-assets/**

  publish-stage-prerelease:
    name: publish stage prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    needs: build-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download stage archives
        uses: actions/download-artifact@v4
        with:
          pattern: role-model-stage-candidate-*
          path: stage-release-assets
          merge-multiple: true

      - name: Verify complete stage archive set
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          expected=(
            "role-model-stage-${short_sha}-linux-x64.tar.gz"
            "role-model-stage-${short_sha}-darwin-x64.tar.gz"
            "role-model-stage-${short_sha}-darwin-arm64.tar.gz"
            "role-model-stage-${short_sha}-win32-x64.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "stage-release-assets/$archive" || {
              echo "Missing stage prerelease archive: $archive"
              exit 1
            }
          done
          archive_count="$(find stage-release-assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          if [[ "$archive_count" != "4" ]]; then
            echo "Stage prerelease must contain exactly four platform archives."
            exit 1
          fi

      - name: Write stage checksum manifest
        shell: bash
        run: |
          cd stage-release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create or update stage prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          candidate_tag="stage-rc-${short_sha}"
          cat > stage-release-notes.md <<EOF
          # role-model stage release candidate ${short_sha}

          This is a **prerelease for human acceptance testing**, built from the exact public stage commit \`${GITHUB_SHA}\` and its paired private stage revision.

          It runs as \`role-model-stage\` on \`http://127.0.0.1:3457\` with isolated stage state. It is not a production release and is not selected by the stable installers.

          1. Download the archive for your platform.
          2. Verify it against \`SHA256SUMS.txt\`.
          3. Extract and run the stage launcher/runtime.
          4. Exercise the intended behavior and persistent state on port 3457.
          5. If accepted, run the **accept-release-candidate** workflow for \`${candidate_tag}\` before promoting stage to main or creating a stable tag.
          EOF
          if gh release view "$candidate_tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${candidate_tag}:refs/tags/${candidate_tag}"
            existing_sha="$(git rev-list -n 1 "$candidate_tag")"
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Existing stage prerelease tag points to a different commit."
              exit 1
            fi
            gh release upload "$candidate_tag" stage-release-assets/* --clobber
            gh release edit "$candidate_tag" \
              --title "Stage RC ${short_sha}" \
              --notes-file stage-release-notes.md \
              --prerelease
          else
            gh release create "$candidate_tag" stage-release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Stage RC ${short_sha}" \
              --notes-file stage-release-notes.md \
              --prerelease
          fi

  publish-release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: role-model-runtime-*
          path: release-assets
          merge-multiple: true

      - name: Copy installer scripts
        run: |
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1

      - name: Write checksum manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Generate recursive release changelog
        run: node scripts/generate-recursive-release-changelog.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="$(cat release-notes.md)"
          prerelease_flag=()
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes "$notes" \
              "${prerelease_flag[@]}"
          fi
