version: "1.0"
execution_mode: remote_only
routing:
  strategy: balanced
model_aliases:
  default.decision-only:
    mode: basic
    model_ids:
      - openai/gpt-4.1-mini-fast
  baseline.decision-only:
    mode: basic
    model_ids:
      - openai/gpt-4.1-mini-fast
  controller.decision-only:
    mode: intelligent
    model_ids:
      - openai/gpt-4.1-mini-fast
  difficulty.decision-only:
    mode: difficulty
    model_ids:
      - openai/gpt-4.1-mini-fast
  hybrid.decision-only:
    mode: hybrid
    model_ids:
      - openai/gpt-4.1-mini-fast
  default.hybrid:
    mode: basic
    model_ids:
      - openai/gpt-4.1-mini-fast
  baseline.hybrid:
    mode: basic
    model_ids:
      - openai/gpt-4.1-mini-fast
  controller.hybrid:
    mode: intelligent
    model_ids:
      - openai/gpt-4.1-mini-fast
  difficulty.hybrid:
    mode: difficulty
    model_ids:
      - openai/gpt-4.1-mini-fast
  hybrid.hybrid:
    mode: hybrid
    model_ids:
      - openai/gpt-4.1-mini-fast
  default.remote-only:
    mode: basic
    model_ids:
      - openai/gpt-4.1-mini-fast
  baseline.remote-only:
    mode: basic
    model_ids:
      - openai/gpt-4.1-mini-fast
  controller.remote-only:
    mode: intelligent
    model_ids:
      - openai/gpt-4.1-mini-fast
  difficulty.remote-only:
    mode: difficulty
    model_ids:
      - openai/gpt-4.1-mini-fast
  hybrid.remote-only:
    mode: hybrid
    model_ids:
      - openai/gpt-4.1-mini-fast
litellm_proxy:
  command: node
  args:
    - D:\DEV\role-model\.tmp\pi-role-model-openai-mock.cjs
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      model_list:
        - model_name: openai/gpt-4.1-mini-fast
          max_difficulty: hard
          litellm_params:
            model: openai/gpt-4.1-mini
