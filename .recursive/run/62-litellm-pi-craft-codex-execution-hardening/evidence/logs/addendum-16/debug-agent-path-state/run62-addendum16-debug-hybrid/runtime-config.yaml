version: "1.0"
execution_mode: hybrid
routing:
  strategy: balanced
observed_data:
  enabled: true
  aggregation:
    min_samples: 2
  difficulty_learning:
    cache_ttl_ms: 900000
    invalidation:
      max_context_tokens_delta: 800
      max_history_turn_delta: 2
      max_tool_count_delta: 1
      max_instruction_constraint_delta: 3
      max_decomposition_keyword_delta: 2
      reclassify_on_code_or_schema_change: true
    override:
      min_samples: 999
      max_failure_rate: 0.35
      min_quality_score: 0.7
      min_tokens_per_sec: 18
    recommendation:
      min_samples: 4
      max_failure_rate: 0.2
      min_quality_score: 0.8
      min_tokens_per_sec: 22
  metric_halflives:
    quality_ms: 900000
    latency_ms: 300000
    throughput_ms: 120000
    reliability_ms: 600000
    cost_ms: 1800000
  throughput_sla:
    enabled: true
    min_tokens_per_sec: 24
    penalty_timeout_ms: 600000
    penalty_factor: 0
difficulty_classifier:
  enabled: true
  rubric_version: v1
  source_type: remote
  model_id: openai/gpt-4.1-mini-fast
  timeout_ms: 1500
  fallback_difficulty: medium
controller:
  enabled: true
  source_type: remote
  model_id: openai/gpt-4.1-mini-fast
  timeout_ms: 1500
model_aliases:
  default.decision-only:
    mode: basic
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  baseline.decision-only:
    mode: basic
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  controller.decision-only:
    mode: intelligent
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  difficulty.decision-only:
    mode: difficulty
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  hybrid.decision-only:
    mode: hybrid
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  default.hybrid:
    mode: basic
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  baseline.hybrid:
    mode: basic
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  controller.hybrid:
    mode: intelligent
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  difficulty.hybrid:
    mode: difficulty
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  hybrid.hybrid:
    mode: hybrid
    model_ids:
      - chatgpt/gpt-5.4
      - local/llama-3.1-8b-instruct
      - openai/gpt-4.1-mini-fast
  default.local-only:
    mode: basic
    model_ids:
      - local/llama-3.1-8b-instruct
  baseline.local-only:
    mode: basic
    model_ids:
      - local/llama-3.1-8b-instruct
  controller.local-only:
    mode: intelligent
    model_ids:
      - local/llama-3.1-8b-instruct
  difficulty.local-only:
    mode: difficulty
    model_ids:
      - local/llama-3.1-8b-instruct
  hybrid.local-only:
    mode: hybrid
    model_ids:
      - local/llama-3.1-8b-instruct
  default.remote-only:
    mode: basic
    model_ids:
      - chatgpt/gpt-5.4
      - openai/gpt-4.1-mini-fast
  baseline.remote-only:
    mode: basic
    model_ids:
      - chatgpt/gpt-5.4
      - openai/gpt-4.1-mini-fast
  controller.remote-only:
    mode: intelligent
    model_ids:
      - chatgpt/gpt-5.4
      - openai/gpt-4.1-mini-fast
  difficulty.remote-only:
    mode: difficulty
    model_ids:
      - chatgpt/gpt-5.4
      - openai/gpt-4.1-mini-fast
  hybrid.remote-only:
    mode: hybrid
    model_ids:
      - chatgpt/gpt-5.4
      - openai/gpt-4.1-mini-fast
