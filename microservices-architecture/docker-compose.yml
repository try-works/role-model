version: '3.8'

services:
  service-registry:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: registry
    container_name: service-registry
    ports:
      - "3001:3001"
    environment:
      - REGISTRY_PORT=3001
    networks:
      - microservices-net

  event-store:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: event-store
    container_name: event-store
    ports:
      - "3002:3002"
    environment:
      - EVENT_STORE_PORT=3002
    networks:
      - microservices-net

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - REGISTRY_URL=http://service-registry:3001
      - EVENT_STORE_URL=http://event-store:3002
    depends_on:
      - service-registry
      - event-store
    networks:
      - microservices-net

  user-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: user-service
    container_name: user-service
    ports:
      - "3003:3003"
    environment:
      - USER_SERVICE_PORT=3003
      - REGISTRY_URL=http://service-registry:3001
      - EVENT_STORE_URL=http://event-store:3002
    depends_on:
      - service-registry
      - event-store
    networks:
      - microservices-net

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: order-service
    container_name: order-service
    ports:
      - "3004:3004"
    environment:
      - ORDER_SERVICE_PORT=3004
      - REGISTRY_URL=http://service-registry:3001
      - EVENT_STORE_URL=http://event-store:3002
    depends_on:
      - service-registry
      - event-store
    networks:
      - microservices-net

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: payment-service
    container_name: payment-service
    ports:
      - "3005:3005"
    environment:
      - PAYMENT_SERVICE_PORT=3005
      - REGISTRY_URL=http://service-registry:3001
      - EVENT_STORE_URL=http://event-store:3002
    depends_on:
      - service-registry
      - event-store
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
